name: Verifica GitHub Actions

on:
  workflow_dispatch:

permissions: {}

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla accesso a Tribuna
        run: |
          curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            'https://tribuna-biancorossa.confidentantelope1.chatgpt.site/api/updates'
